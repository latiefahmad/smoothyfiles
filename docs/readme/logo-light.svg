<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>smoothyfiles — SF monogram (light)</title>
  <defs>
    <linearGradient id="sfl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F7F8"/><stop offset="1" stop-color="#E8E8EC"/>
    </linearGradient>
    <linearGradient id="sfl-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A4F"/><stop offset="1" stop-color="#1C1C1F"/>
    </linearGradient>
    <linearGradient id="sfl-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C31"/><stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="sfl-sf" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFD2A6"/><stop offset="1" stop-color="#FF6A1A"/>
    </linearGradient>
    <radialGradient id="sfl-glow" cx="256" cy="308" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6A1A" stop-opacity="0.30"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sfl-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sfl-frontclip"><rect x="96" y="172" width="320" height="254" rx="60"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sfl-bg)"/>
  <!-- folder back + tab -->
  <path d="M96 160c0-35.3 28.7-64 64-64h80c18.6 0 36.4 7.4 49.5 20.5l15 15c13.1 13.1 30.9 20.5 49.5 20.5h55c35.3 0 64 28.7 64 64v146c0 35.3-28.7 64-64 64H160c-35.3 0-64-28.7-64-64z" fill="url(#sfl-back)"/>
  <!-- folder front -->
  <rect x="96" y="172" width="320" height="254" rx="60" fill="url(#sfl-front)"/>
  <rect x="96" y="172" width="320" height="150" rx="60" fill="url(#sfl-rim)" clip-path="url(#sfl-frontclip)"/>
  <rect x="96" y="172" width="320" height="254" fill="url(#sfl-glow)" clip-path="url(#sfl-frontclip)"/>
  <!-- SF monogram -->
  <text x="256" y="356" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="148" letter-spacing="4" fill="url(#sfl-sf)">SF</text>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#E3E3E6" stroke-width="2"/>
</svg>
