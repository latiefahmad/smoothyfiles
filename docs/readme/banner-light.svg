x="256" y="356" fill="url(#smb-sf)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="148" font-weight="800" letter-spacing="4" text-anchor="middle">SF</text></svg><text x="272" y="196" fill="#1B1B1B" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800">smoothyfiles</text><text x="276" y="244" fill="#5C5C61" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28">A file manager for Windows that never freezes.</text><text x="276" y="284" fill="#8A8A90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22">Tabs, dual panes, archives as folders, and DirectLook previews.</text><rect width="1280" height="52" x="0" y="308" fill="#FAFAFA"/><rect width="1280" height="1" x="0" y="308" fill="#E3E3E6"/><text x="64" y="340" fill="#5C5C61" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20">100,000 files</text><text x="1216" y="340" fill="#8A8A90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" text-anchor="end">listed in 168 ms</text></g><rect width="1279" height="359" x=".5" y=".5" fill="none" stroke="#E3E3E6" rx="12"/></svg>