<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360"><title>smoothyfiles: a file manager for Windows that never freezes</title><defs><linearGradient id="smd-bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#26262A"/><stop offset="1" stop-color="#1B1B1F"/></linearGradient><radialGradient id="smd-ember" cx="120" cy="180" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF6A1A" stop-opacity=".14"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></radialGradient><linearGradient id="smd-sf" x1="0" x2=".35" y1="0" y2="1"><stop offset="0" stop-color="#FFD2A6"/><stop offset="1" stop-color="#FF6A1A"/></linearGradient><linearGradient id="smd-back" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3E3E44"/><stop offset="1" stop-color="#232327"/></linearGradient><linearGradient id="smd-front" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2C2C31"/><stop offset="1" stop-color="#0A0A0C"/></linearGradient><radialGradient id="smd-glow" cx="256" cy="308" r="210" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FF6A1A" stop-opacity=".32"/><stop offset="1" stop-color="#FF6A1A" stop-opacity="0"/></radialGradient><clipPath id="smd-frontclip"><rect width="320" height="254" x="96" y="172" rx="60"/></clipPath><clipPath id="smd-win"><rect width="1279" height="359" x=".5" y=".5" rx="12"/></clipPath></defs><g clip-path="url(#smd-win)"><rect width="1280" height="360" fill="url(#smd-bg)"/><rect width="1280" height="360" fill="url(#smd-ember)"/><svg width="168" height="168" x="64" y="96" viewBox="96 86 320 340"><path fill="url(#smd-back)" d="M96 160c0-35.3 28.7-64 64-64h80c18.6 0 36.4 7.4 49.5 20.5l15 15c13.1 13.1 30.9 20.5 49.5 20.5h55c35.3 0 64 28.7 64 64v146c0 35.3-28.7 64-64 64H160c-35.3 0-64-28.7-64-64z"/><rect width="320" height="254" x="96" y="172" fill="url(#smd-front)" rx="60"/><rect width="320" height="254" x="96" y="172" fill="url(#smd-glow)" clip-path="url(#smd-frontclip)"/><text x="256" y="356" fill="url(#smd-sf)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="148" font-weight="800" letter-spacing="4" text-anchor="middle">SF</text></svg><text x="272" y="196" fill="#F5F5F7" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800">smoothyfiles</text><text x="276" y="244" fill="#A8A8AE" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28">A file manager for Windows that never freezes.</text><text x="276" y="284" fill="#8A8A90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22">Tabs, dual panes, archives as folders, and DirectLook previews.</text><rect width="1280" height="52" x="0" y="308" fill="#212125"/><rect width="1280" height="1" x="0" y="308" fill="#3A3A40"/><text x="64" y="340" fill="#A8A8AE" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20">100,000 files</text><text x="1216" y="340" fill="#8A8A90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" text-anchor="end">listed in 168 ms</text></g><rect width="1279" height="359" x=".5" y=".5" fill="none" stroke="#3A3A40" rx="12"/></svg>