ShortDescription: A fast, free and open-source file manager for Windows, written in Rust, that never freezes.
Description: |-
  smoothyfiles is a file manager for Windows, written from scratch in Rust, meant to replace File Explorer for everyday work. The window never waits on the disk: listing, icons, thumbnails, previews and file operations run off the UI thread, so a slow network share or a folder with 100,000 files can't freeze it.
  Tabs, dual panes, details / grid / column views, colour tags, Git status, archives (ZIP, 7z, RAR, tar, ISO) that open like folders, DirectLook for Quick Look-style previews with Space, and a parallel copy engine with conflict handling, pause, verification and resume after a crash.
